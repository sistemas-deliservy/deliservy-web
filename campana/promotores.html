<head>

<style>
  body{margin:0;background:#08080a;color:#fff;font-family:Inter,system-ui,sans-serif;}

  p{color:rgba(255,255,255,.72);font-size:17px;line-height:1.45;margin:0 0 22px;}
  .video{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}
  .btn{display:inline-flex;margin-top:22px;background:linear-gradient(135deg,#e41616,#ff5a1f);color:#fff;font-weight:700;text-decoration:none;border-radius:12px;padding:14px 18px;}

</head>
<body>

  <div class="video">

  </div>

<script>
(function () {
  var video = document.querySelector("video");
  if (!video) return;
  var intento = video.play();
  if (!intento || !intento.catch) return;
  intento.catch(function () {
    video.muted = true;
    video.play().catch(function () {});
  });
})();
</script>
